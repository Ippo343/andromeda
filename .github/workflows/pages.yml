name: Pages

# Publishes https://ippo343.github.io/andromeda/ - the browser flasher (#162)
# and, since #733, the OTA index and images the device's SPA reads.
#
# Dispatched by tools/release-local.ps1 after it verifies the published assets.
# Every slot is resolved locally. This job downloads public releases with a
# read-only token and checks the assembled site before it goes live.
#
# The binaries must be served same-origin: GitHub release-asset downloads send
# no Access-Control-Allow-Origin header (verified against a real release asset
# - api.github.com sends one, release downloads don't), so a page fetching them
# straight from github.com/.../releases/download/... fails in the browser. This
# job downloads the requested releases' assets and serves the exact released
# bits from the Pages artifact - nothing is rebuilt, and no binary is ever
# committed to git (artifact deploy via actions/deploy-pages, not a gh-pages
# branch).
#
# One-time repo-settings prerequisite, outside this file's reach: GitHub
# Pages must be enabled with Source = "GitHub Actions" (Settings > Pages) -
# actions/configure-pages@v5 below runs with its default enablement: false,
# and if Pages isn't already on, its own getPages() 404s and the step throws.
# enablement: true is not a usable substitute: it requires a token other than
# GITHUB_TOKEN (a PAT with repo scope, or a GitHub App with
# administration:write), so it would swap this failure for a different one,
# not fix it. If that setting is ever turned off, configure-pages 404s and
# this job fails loudly rather than deploying to an unreachable site.
on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Stable release tag to publish as current/"
        required: true
      previous_tag:
        description: "Previous stable tag for the flasher's downgrade slot (optional)"
        required: false
        default: ""
      dev_tag:
        description: "Newest dev/pre-release tag to publish under dev/ (optional)"
        required: false
        default: ""
      rehearsal_repo:
        description: "Explicit owner/repo for a non-production Pages rehearsal"
        required: false
        default: ""

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

env:
  REL_TAG: ${{ inputs.tag }}
  PREV_TAG: ${{ inputs.previous_tag }}
  DEV_TAG: ${{ inputs.dev_tag }}

jobs:
  deploy:
    if: github.repository == 'Ippo343/andromeda' || github.repository == inputs.rehearsal_repo
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Download the released assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for slot in current previous dev; do
            case "$slot" in
              current)  tag="$REL_TAG";  dir=dl ;;
              previous) tag="$PREV_TAG"; dir=dl-previous ;;
              dev)      tag="$DEV_TAG";  dir=dl-dev ;;
            esac
            [ -n "$tag" ] || continue
            # '*.bin' is every non-bundled part's own asset: firmware-*.bin on
            # every release, and additionally littlefs-*.bin on releases cut
            # before the filesystem image was retired (v1.3 and older) - the
            # previous-stable slot is often exactly such a release.
            gh release download "$tag" --repo "$GITHUB_REPOSITORY" --dir "$dir" \
              --pattern 'manifest.json' \
              --pattern 'flashparts-*.zip' --pattern '*.bin'
          done

      # build-scripts/make_manifest.py records the size + md5 of exactly these
      # bytes in manifest.json. Nothing downstream re-checks them, so a
      # truncated or corrupted release-asset download would be assembled into
      # _site and served as the image a stranger flashes onto a bare board -
      # bricking it, with no error anywhere. Verify before assemble_site.py
      # runs; a mismatch is a hard failure.
      - name: Verify the downloaded binaries against the manifest md5
        run: |
          fail=0
          for slot in current previous dev; do
            case "$slot" in
              current)  tag="$REL_TAG";  dir=dl ;;
              previous) tag="$PREV_TAG"; dir=dl-previous ;;
              dev)      tag="$DEV_TAG";  dir=dl-dev ;;
            esac
            [ -n "$tag" ] || continue
            test -f "$dir/manifest.json" || { echo "::error::$tag: manifest.json is not a release asset"; exit 1; }
          for env in esp32_wroom esp32_s3_zero esp32_c3_zero; do
            # fw -> firmware-*.bin on every release; fs -> littlefs-*.bin on
            # releases old enough to still ship a filesystem image (v1.3 and
            # older). Both end up flashed to a bare board, so both are checked.
            for key in fw fs; do
              case "$key" in fw) name=firmware ;; fs) name=littlefs ;; esac
              file="$dir/$name-$env-$tag.bin"
              if [ ! -f "$file" ]; then
                if [ "$key" = fs ]; then continue; fi
                echo "::error::$file is not a release asset"; fail=1; continue
              fi
              # v2.0's manifest.json still has the physical rows; v2.1+ has only
              # the _v2 rows. Accept either and take the first match.
              want=$(jq -r --arg b "$env" --arg k "$key" \
                     '[.boards[] | select(.board==$b or .board==($b+"_v2")) | .[$k].md5] | first' \
                     "$dir/manifest.json")
              if [ -z "$want" ] || [ "$want" = "null" ]; then
                echo "::error::$env: manifest.json has no $key.md5"; fail=1; continue
              fi
              got=$(md5sum "$file" | cut -d' ' -f1)
              if [ "$got" != "$want" ]; then
                echo "::error::$file md5 $got does not match manifest $want"; fail=1
              else
                echo "ok  $file  $got"
              fi
            done
          done
          done
          [ "$fail" -eq 0 ]

      - name: Unpack each board's parts
        run: |
          fail=0
          for slot in current previous dev; do
            case "$slot" in
              current)  tag="$REL_TAG";  dir=dl;           dest=parts ;;
              previous) tag="$PREV_TAG"; dir=dl-previous;  dest=parts-previous ;;
              dev)      tag="$DEV_TAG";  dir=dl-dev;       dest=parts-dev ;;
            esac
            [ -n "$tag" ] || continue
          for env in esp32_wroom esp32_s3_zero esp32_c3_zero; do
            mkdir -p "$dest/$env"
            unzip -q "$dir/flashparts-$env-$tag.zip" -d "$dest/$env"
            # The zip holds only the boot parts. Everything else is its own
            # <part>-<env>-<tag>.bin asset, named by the board's own parts.json
            # (firmware.bin everywhere; littlefs.bin on releases that still
            # shipped a filesystem image - e.g. the previous-stable slot). Only
            # an explicit bundled: false counts: a part listed without the flag
            # is one the dump script zipped.
            while read -r name file; do
              # ${file%$'\r'}: jq emits CRLF on Windows, and this step runs
              # under the Python test's Git bash there too.
              cp "$dir/$name-$env-$tag.bin" "$dest/$env/${file%$'\r'}"
            done < <(jq -r '.parts[] | select(.bundled == false) | "\(.name) \(.file)"' \
                       "$dest/$env/parts.json")
          done
          done

      - name: Assemble the site
        run: |
          current_args=()
          if [ -n "$PREV_TAG" ]; then
            current_args=(--previous-parts-dir parts-previous --previous-tag "$PREV_TAG")
          fi
          python build-scripts/assemble_site.py \
            --parts-dir parts --out _site \
            --tag "$REL_TAG" --repo "$GITHUB_REPOSITORY" \
            --ota-manifest dl/manifest.json --ota-channel stable "${current_args[@]}"
          # The on-device SPA reads ota.json; --require-ota is what proves the
          # slot it reads actually carries one.
          python build-scripts/check_site.py --site _site --require-ota --ota-channel stable

          if [ -n "$DEV_TAG" ]; then
            python build-scripts/assemble_site.py \
              --parts-dir parts-dev --out _site/dev \
              --tag "$DEV_TAG" --repo "$GITHUB_REPOSITORY" \
              --ota-manifest dl-dev/manifest.json --ota-channel dev
            python build-scripts/check_site.py --site _site/dev --require-ota --ota-channel dev
          fi
          du -sh _site

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4

      # deploy-pages succeeding only means a deployment was *created*, not that
      # the site answers. A truncated upload artifact, a Pages propagation
      # failure, or an assemble_site.py change that wrote into the wrong
      # subdirectory would all end this run green with an installer that 404s.
      # Fetch the live URL and fail unless it actually serves the manifest and
      # the binaries it points at. (Seen for real once: a rollback that
      # disabled the Pages repo setting left configure/deploy green against an
      # unreachable site.)
      - name: Verify the deployed site answers
        env:
          PAGE_URL: ${{ steps.deployment.outputs.page_url }}
        run: |
          set -euo pipefail
          # A cache-buster (GitHub Pages caches by full URL, query string
          # included): without it this can read the *previous* deployment's
          # manifest seconds after the deploy and verify the wrong site.
          bust="?v=${GITHUB_RUN_ID:-$(date +%s)}"
          curl -fsS "${PAGE_URL}manifest.json${bust}" -o live-manifest.json
          # Assert the tag, not just the shape: a stale manifest has the same
          # three builds.
          jq -e --arg tag "$REL_TAG" '.version == $tag and (.builds | length == 3)' \
            live-manifest.json > /dev/null
          # Every part, not just parts[0]: the builds are ordered by offset, so
          # [0] is the ~30 KB bootloader and the firmware - the one that has to
          # be there for the board to boot - was never fetched.
          for path in $(jq -r '.builds[].parts[].path' live-manifest.json); do
            path="${path%$'\r'}"
            echo "HEAD ${PAGE_URL}${path}"
            curl -fsI "${PAGE_URL}${path}${bust}" > /dev/null
          done
          verify_ota() {
            local slot="$1" prefix="${PAGE_URL}$1"
            # Compare the live index and complete bodies with the verified
            # artifact. The device reads both cross-origin.
            for path in ota.json $(jq -r '.boards[].path' "_site/${slot}ota.json"); do
              path="${path%$'\r'}"
              echo "GET ${prefix}${path}"
              curl -fsS --max-time 30 -H 'Origin: http://andromeda.local' \
                -D live-ota-headers.txt "${prefix}${path}${bust}" -o live-ota-body
              grep -iqE '^access-control-allow-origin: \*\s*$' live-ota-headers.txt
              cmp "_site/${slot}${path}" live-ota-body
            done
          }
          verify_ota ""
          if [ -n "$PREV_TAG" ]; then
            curl -fsS "${PAGE_URL}previous/manifest.json${bust}" -o previous-manifest.json
            jq -e --arg tag "$PREV_TAG" '.version == $tag and (.builds | length == 3)' previous-manifest.json > /dev/null
            for path in $(jq -r '.builds[].parts[].path' previous-manifest.json); do
              path="${path%$'\r'}"
              echo "HEAD ${PAGE_URL}previous/${path}"
              curl -fsI "${PAGE_URL}previous/${path}${bust}" > /dev/null
            done
          fi
          if [ -n "$DEV_TAG" ]; then
            verify_ota "dev/"
          fi
          echo "live site OK: ${PAGE_URL}"
