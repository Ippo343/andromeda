name: Release

# One `git push` of an annotated v* tag runs the full test suite - which
# builds all three boards' firmware, filesystem and flashparts images as part
# of test.yml's hardware-build job - and republishes those same images as a
# GitHub Release with the OTA assets (#63) plus the browser-installer boot
# parts (#162): firmware-<env>-<tag>.bin x3, littlefs-<env>-<tag>.bin x3,
# flashparts-<env>-<tag>.zip x3, manifest.json - 10 assets total (see the
# derived EXPECTED_ASSETS check below). Nothing is built a second time here.
#
# Channel comes from the tag suffix: v1.2.3-name-dev / -alpha / -beta / -rcN,
# each with an optional trailing iteration number (-alpha-1, -beta-37),
# publish as a pre-release = the dev channel; a plain v1.2.3-name is stable.
# A device only ever tracks pre-releases if its owner ticked the box. Only a
# stable release triggers the chained `pages` job below - the web installer
# always serves the newest *stable* build.
on:
  push:
    tags:
      - "v*"

jobs:
  # A tag push fires neither of test.yml's own triggers, so without this the
  # release job would build and publish to the fleet having run no tests at
  # all - the project's "full suite green on every commit" discipline had no
  # enforcement at the one moment it mattered most. Reusing test.yml rather
  # than duplicating its steps keeps one definition of "the suite".
  test:
    name: Test suite
    uses: ./.github/workflows/test.yml

  release:
    name: Build + publish OTA release
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: write # gh release create / upload
    outputs:
      prerelease: ${{ steps.meta.outputs.prerelease }}
      tag: ${{ github.ref_name }}

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # inject_version.py's `git describe` needs full history + tags

      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Reject a lightweight tag
        run: |
          # OTA releases must be annotated tags - a stray `git push` of a
          # lightweight tag shouldn't ship to the fleet.
          #
          # actions/checkout writes the tag as a lightweight ref pointing
          # straight at the commit, dropping the annotation, so re-fetch the
          # real tag object from origin before inspecting it.
          git fetch --force origin "refs/tags/${GITHUB_REF_NAME}:refs/tags/${GITHUB_REF_NAME}"
          if [ "$(git cat-file -t "$GITHUB_REF_NAME")" != "tag" ]; then
            echo "::error::$GITHUB_REF_NAME is a lightweight tag; annotate it (git tag -a) to release."
            exit 1
          fi

      - name: Derive channel + version code from the tag
        id: meta
        run: |
          TAG="$GITHUB_REF_NAME"
          if echo "$TAG" | grep -Eq -- '-(dev|alpha|beta|rc[0-9]*)(-[0-9]+)?$'; then
            echo "channel=dev" >> "$GITHUB_OUTPUT"
            echo "prerelease=true" >> "$GITHUB_OUTPUT"
          else
            echo "channel=stable" >> "$GITHUB_OUTPUT"
            echo "prerelease=false" >> "$GITHUB_OUTPUT"
          fi
          # Packed-semver code from the tag (#164) - the same function
          # inject_version.py bakes into the firmware, so the manifest's
          # versionCode and FIRMWARE_VERSION_CODE always agree for a tag.
          echo "version_code=$(python build-scripts/version_code.py "$TAG")" >> "$GITHUB_OUTPUT"

      # Before anything is built: a version code that isn't strictly greater
      # than the newest published one produces a release the fleet can never
      # see. Devices compare `latest.versionCode > FIRMWARE_VERSION_CODE`, so
      # such a release is reported UpToDate and silently never offered - which
      # is exactly what a hot-fix that forgot to bump the version number would
      # do. Fail here, loudly, rather than publish something invisible.
      - name: Version code must be newer than the published one
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python build-scripts/check_version_code.py \
            --repo "$GITHUB_REPOSITORY" \
            --tag "$GITHUB_REF_NAME" \
            --version-code "${{ steps.meta.outputs.version_code }}"

      # Every image here was already built - and gated - by the `test` job's
      # hardware-build matrix above (needs: test). Rebuilding a second time
      # here bought nothing but several extra minutes and a chance of a
      # second, non-identical build silently diverging from the one CI just
      # verified; reuse it instead. (Correctness depends on test.yml's
      # hardware-build checkout using fetch-depth: 0, so the version baked
      # into the binary by inject_version.py is the real one - see that
      # step's comment.)
      - name: Download the images test.yml's hardware-build already built
        uses: actions/download-artifact@v4
        with:
          pattern: "flashparts-*"
          path: downloaded

      - name: Stage the already-built images
        run: |
          for env in esp32_wroom esp32_s3_zero esp32_c3_zero; do
            mkdir -p "staging/$env/flashparts"
            cp "downloaded/flashparts-$env/firmware.bin" "staging/$env/firmware.bin"
            cp "downloaded/flashparts-$env/littlefs.bin" "staging/$env/littlefs.bin"
            # Boot parts only, into their own subdir - firmware/littlefs stay
            # at staging/$env/ above; the zip step below reads only this dir.
            cp "downloaded/flashparts-$env/bootloader.bin" \
               "downloaded/flashparts-$env/partitions.bin" \
               "downloaded/flashparts-$env/boot_app0.bin" \
               "downloaded/flashparts-$env/parts.json" \
               "staging/$env/flashparts/"
          done

      - name: Stage release assets
        run: |
          TAG="$GITHUB_REF_NAME"
          mkdir -p dist
          for env in esp32_wroom esp32_s3_zero esp32_c3_zero; do
            cp "staging/$env/firmware.bin" "dist/firmware-$env-$TAG.bin"
            cp "staging/$env/littlefs.bin" "dist/littlefs-$env-$TAG.bin"
            # Boot parts only (~30 KB) - firmware/littlefs stay their own
            # assets above; build-scripts/assemble_site.py's caller in
            # pages.yml unzips this and renames those two back in alongside it.
            # `zip archive .` with neither -r nor a shell-expanded glob adds
            # nothing (bare "." isn't file content to zip, and there's no -r
            # to recurse into it) - "zip error: Nothing to do!", caught by
            # actually running this in CI on a dry-run tag (#162). `./*`
            # forces the shell to expand it to the real file list first.
            (cd "staging/$env/flashparts" && zip -q -j "$GITHUB_WORKSPACE/dist/flashparts-$env-$TAG.zip" ./*)
          done
          python build-scripts/make_manifest.py \
            --repo "$GITHUB_REPOSITORY" --tag "$TAG" \
            --channel "${{ steps.meta.outputs.channel }}" \
            --version-code "${{ steps.meta.outputs.version_code }}" \
            --build-dir staging \
            --out dist/manifest.json
          ls -l dist

      # Two steps, not one, and deliberately so. Creating the release live
      # meant a device polling mid-upload could fetch a manifest.json whose
      # firmware URLs 404 - and with the filesystem write erasing LittleFS
      # before it fetches, that is a device with no web UI. It only ever
      # worked because `dist/*` globs alphabetically (f < l < m), putting the
      # manifest last: an accident, not a guarantee, that renaming any asset
      # would have silently removed. A draft is invisible to the OTA check, so
      # the upload can't be observed half-done.
      - name: Upload assets to a draft release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="$GITHUB_REF_NAME"
          # Publishing in two steps means a run can now fail *after* the draft
          # exists (a short upload, a failed asset check). gh release create
          # refuses a tag that already has a release, so without this a single
          # failed attempt would block every retry of that tag. Clear a
          # leftover draft first - never a published one, which would be
          # destroying a release the fleet may already have seen.
          if [ "$(gh release view "$TAG" --json isDraft --jq .isDraft 2>/dev/null)" = "true" ]; then
            echo "Removing a leftover draft for $TAG from a previous failed run."
            gh release delete "$TAG" --yes
          fi
          FLAGS="--title $TAG --generate-notes --draft"
          [ "${{ steps.meta.outputs.prerelease }}" = "true" ] && FLAGS="$FLAGS --prerelease"
          gh release create "$TAG" dist/* $FLAGS

      - name: Verify the draft has every asset, then publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="$GITHUB_REF_NAME"
          # Derived from what was actually staged, not a literal (#181 - the
          # count already drifted once, 7 -> 10, when the flashparts zips
          # landed for #162). The floor still catches a catastrophic staging
          # failure from trivially satisfying the check.
          EXPECTED_ASSETS=$(find dist -maxdepth 1 -type f | wc -l)
          if [ "$EXPECTED_ASSETS" -lt 10 ]; then
            echo "::error::only $EXPECTED_ASSETS files staged in dist/ - refusing to publish."
            exit 1
          fi
          actual=$(gh release view "$TAG" --json assets --jq '.assets | length')
          if [ "$actual" -ne "$EXPECTED_ASSETS" ]; then
            echo "::error::$TAG has $actual assets, expected $EXPECTED_ASSETS - not publishing."
            gh release view "$TAG" --json assets --jq '.assets[].name'
            exit 1
          fi
          gh release edit "$TAG" --draft=false
          echo "Published $TAG with $actual assets."

  # `gh release edit --draft=false` above runs as GITHUB_TOKEN, and events
  # raised by GITHUB_TOKEN never start new workflow runs - an `on: release`
  # trigger on pages.yml would silently never fire for our own releases. So
  # the deploy is chained here instead, gated to stable releases only (the
  # web installer always serves the newest stable build; the dev channel
  # stays an OTA-only opt-in, same as it is today).
  pages:
    name: Publish the web installer
    needs: release
    if: needs.release.outputs.prerelease == 'false'
    permissions:
      contents: read
      pages: write
      id-token: write
    uses: ./.github/workflows/pages.yml
