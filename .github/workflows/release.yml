name: Release

# One `git push` of an annotated v* tag builds all three boards (firmware +
# filesystem) and publishes a GitHub Release with the 7 OTA assets (#63):
# firmware-<env>-<tag>.bin x3, littlefs-<env>-<tag>.bin x3, manifest.json.
#
# Channel comes from the tag suffix: v1.2.3-name-dev / -alpha / -beta / -rcN
# publish as a pre-release = the dev channel; a plain v1.2.3-name is stable.
# A device only ever tracks pre-releases if its owner ticked the box.
on:
  push:
    tags:
      - "v*"

jobs:
  release:
    name: Build + publish OTA release
    runs-on: ubuntu-latest
    permissions:
      contents: write # gh release create / upload

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # git rev-list --count needs full history

      - name: Reject a lightweight tag
        run: |
          # OTA releases must be annotated tags - a stray `git push` of a
          # lightweight tag shouldn't ship to the fleet.
          #
          # actions/checkout writes the tag as a lightweight ref pointing
          # straight at the commit, dropping the annotation, so re-fetch the
          # real tag object from origin before inspecting it.
          git fetch --force origin "refs/tags/${GITHUB_REF_NAME}:refs/tags/${GITHUB_REF_NAME}"
          if [ "$(git cat-file -t "$GITHUB_REF_NAME")" != "tag" ]; then
            echo "::error::$GITHUB_REF_NAME is a lightweight tag; annotate it (git tag -a) to release."
            exit 1
          fi

      - name: Derive channel + version code from the tag
        id: meta
        run: |
          TAG="$GITHUB_REF_NAME"
          if echo "$TAG" | grep -Eq -- '-(dev|alpha|beta|rc[0-9]*)$'; then
            echo "channel=dev" >> "$GITHUB_OUTPUT"
            echo "prerelease=true" >> "$GITHUB_OUTPUT"
          else
            echo "channel=stable" >> "$GITHUB_OUTPUT"
            echo "prerelease=false" >> "$GITHUB_OUTPUT"
          fi
          echo "version_code=$(git rev-list --count "$TAG")" >> "$GITHUB_OUTPUT"

      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Install PlatformIO
        run: pip install --upgrade platformio

      - name: Build every board, staging each image as it finishes
        run: |
          # Copy firmware.bin / littlefs.bin into staging/<env>/ immediately,
          # before the next `pio run` in the loop: a later env's build has been
          # seen to wipe an earlier env's .pio/build/<env>/firmware.bin on the
          # hosted runner, so nothing may sit un-staged across a pio invocation.
          for env in esp32_wroom esp32_s3_zero esp32_c3_zero; do
            mkdir -p "staging/$env"
            pio run -e "$env"
            cp ".pio/build/$env/firmware.bin" "staging/$env/firmware.bin"
            pio run -e "$env" -t buildfs
            cp ".pio/build/$env/littlefs.bin" "staging/$env/littlefs.bin"
          done

      - name: Stage release assets
        run: |
          TAG="$GITHUB_REF_NAME"
          mkdir -p dist
          for env in esp32_wroom esp32_s3_zero esp32_c3_zero; do
            cp "staging/$env/firmware.bin" "dist/firmware-$env-$TAG.bin"
            cp "staging/$env/littlefs.bin" "dist/littlefs-$env-$TAG.bin"
          done
          python build-scripts/make_manifest.py \
            --repo "$GITHUB_REPOSITORY" --tag "$TAG" \
            --channel "${{ steps.meta.outputs.channel }}" \
            --version-code "${{ steps.meta.outputs.version_code }}" \
            --build-dir staging \
            --out dist/manifest.json
          ls -l dist

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="$GITHUB_REF_NAME"
          FLAGS="--title $TAG --generate-notes"
          [ "${{ steps.meta.outputs.prerelease }}" = "true" ] && FLAGS="$FLAGS --prerelease"
          gh release create "$TAG" dist/* $FLAGS
