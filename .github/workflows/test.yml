name: Test

on:
  # Only on main directly; PR branches are covered by the pull_request event,
  # so scoping this here avoids every same-repo PR running the whole suite
  # twice (once for push, once for pull_request).
  push:
    branches: [main]
  pull_request:
  # Callable from release.yml, which must not publish OTA firmware to the
  # fleet without the suite having run. A tag push fires neither of the events
  # above, so before this existed a `git push origin v1.2.3` from a red commit
  # built and published every release asset with nothing checking them.
  workflow_call:

jobs:
  native-tests:
    name: Native unit tests + coverage
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Install PlatformIO
        run: pip install --upgrade platformio

      # Pure stdlib, no toolchain - the packed-semver version-code logic (#164)
      # shared by inject_version.py and release.yml. Kept here rather than in
      # its own job so it rides the runner this job already spun up.
      - name: Version-code packer unit tests
        run: python -m unittest discover -s build-scripts -p 'test_*.py'

      - name: Install lcov
        run: sudo apt-get update && sudo apt-get install -y lcov

      # native_coverage extends env:native with --coverage/-lgcov added; the local dev-loop
      # `pio test -e native` skips those (they slow every run ~27% for a report nobody reads
      # locally), but CI wants the report every time, so it builds the coverage env directly.
      - name: Run native unit tests
        run: pio test -e native_coverage

      - name: Generate coverage report
        run: |
          # lcov_branch_coverage is geninfo's actual rc key; an extra --rc branch_coverage=1
          # alongside it silently drops all branch data (verified locally, tools/coverage.ps1
          # has the same fix) -- don't reintroduce it.
          # --ignore-errors mismatch: newer geninfo on the runner treats gcov "mismatched
          # exception tag" noise from libstdc++ template code as fatal; it's not our code
          # (the very next lcov --remove strips /usr/*), so downgrade it to a warning.
          lcov --capture --directory .pio/build/native_coverage --output-file coverage.info \
            --rc lcov_branch_coverage=1 --ignore-errors mismatch
          lcov --remove coverage.info '/usr/*' '*/FastLED/*' '*/Unity/*' '*/test/*' \
            --output-file coverage.info --rc lcov_branch_coverage=1
          lcov --list coverage.info --rc lcov_branch_coverage=1

      - name: Upload coverage report
        uses: actions/upload-artifact@v4
        with:
          name: coverage-info
          path: coverage.info

  web-tests:
    name: Web UI unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "lts/*"

      - name: Run web UI unit tests
        run: npm run test:web

  hardware-build:
    name: Hardware firmware build (${{ matrix.env }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        env: [esp32_wroom, esp32_s3_zero, esp32_c3_zero]
    steps:
      # Full history, not the default shallow depth: build-scripts/
      # inject_version.py's `git rev-list --count HEAD` / `git describe`
      # need it to bake the real version into the binary. On a shallow
      # checkout it silently falls back to "1 commit" / "unknown" instead -
      # invisible while this job's output was only ever a compile gate, but
      # release.yml now reuses these exact images instead of rebuilding
      # (see its "Download the images ... already built" step), so a wrong
      # embedded version here would ship to devices.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Install PlatformIO
        run: pip install --upgrade platformio

      - name: Build firmware
        run: pio run -e ${{ matrix.env }}

      # The filesystem image used to be built only by release.yml, so a data/
      # change that broke it - or overflowed the spiffs partition - passed
      # every PR check and first failed on the release tag, after both firmware
      # halves were already staged. build-scripts/check_fs_ceiling.py gates the
      # size as a post-action.
      - name: Build filesystem image
        run: pio run -e ${{ matrix.env }} -t buildfs

      # Boot parts for the browser web installer (#162) - exercised here on
      # every push/PR, no release or tag involved, so this pipeline is part
      # of the regular suite rather than a dry-run someone has to remember to
      # trigger. firmware.bin/littlefs.bin are copied alongside the exported
      # parts so the artifact is a complete, flat --parts-dir/<env>/ input for
      # web-installer-assemble's build-scripts/assemble_site.py call below.
      - name: Export web-installer flash parts
        run: |
          pio run -e ${{ matrix.env }} -t flashparts
          cp ".pio/build/${{ matrix.env }}/firmware.bin" ".pio/build/${{ matrix.env }}/flashparts/"
          cp ".pio/build/${{ matrix.env }}/littlefs.bin" ".pio/build/${{ matrix.env }}/flashparts/"

      - uses: actions/upload-artifact@v4
        with:
          name: flashparts-${{ matrix.env }}
          path: .pio/build/${{ matrix.env }}/flashparts

  web-installer-assemble:
    name: Web installer assembly
    needs: hardware-build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - uses: actions/download-artifact@v4
        with:
          pattern: "flashparts-*"
          path: parts-raw

      # Every "web-installer-*" pipeline change lands here on every commit:
      # this runs the exact same build-scripts/assemble_site.py call pages.yml
      # makes for a real deploy (offset/NVS-overlap validation, board-list
      # consistency, manifest shape, the shared on-device styling), against
      # real build output, with no release or tag anywhere in the loop.
      - name: Assemble the site
        run: |
          mkdir -p parts
          for env in esp32_wroom esp32_s3_zero esp32_c3_zero; do
            cp -r "parts-raw/flashparts-$env" "parts/$env"
          done
          python build-scripts/assemble_site.py \
            --parts-dir parts --out _site --tag local --repo local/local
          # Inspect what assemble_site.py actually wrote - 3 builds, the 3
          # expected chip families, every referenced part file present. A wrong
          # manifest that still passes assemble_site's own input validation
          # fails here instead of shipping to the deploy with CI green.
          python build-scripts/check_site.py --site _site

      - uses: actions/upload-artifact@v4
        with:
          name: web-installer-preview
          path: _site
