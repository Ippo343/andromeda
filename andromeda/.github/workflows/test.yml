name: Test

on:
  push:
  pull_request:

jobs:
  native-tests:
    name: Native unit tests + coverage
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Install PlatformIO
        run: pip install --upgrade platformio

      - name: Install lcov
        run: sudo apt-get update && sudo apt-get install -y lcov

      - name: Run native unit tests
        run: pio test -e native

      - name: Generate coverage report
        run: |
          lcov --capture --directory .pio/build/native --output-file coverage.info \
            --rc lcov_branch_coverage=1 --rc branch_coverage=1
          lcov --remove coverage.info '/usr/*' '*/FastLED/*' '*/Unity/*' '*/test/*' \
            --output-file coverage.info --rc branch_coverage=1
          lcov --list coverage.info --rc branch_coverage=1

      - name: Upload coverage report
        uses: actions/upload-artifact@v4
        with:
          name: coverage-info
          path: coverage.info

  web-tests:
    name: Web UI unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "lts/*"

      - name: Run web UI unit tests
        run: npm run test:web

  hardware-build:
    name: Hardware firmware build (${{ matrix.env }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        env: [esp32_wroom, esp32_s3_zero, esp32_c3_zero]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Install PlatformIO
        run: pip install --upgrade platformio

      - name: Build firmware
        run: pio run -e ${{ matrix.env }}
