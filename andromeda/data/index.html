<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Andromeda Control</title>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel+Decorative:wght@700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="common.css">
    <style>
        body {
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
        }

        .container {
            text-align: center;
        }



        .fps-display {
            position: fixed;
            top: 1rem;
            right: 1rem;
            background: rgba(0, 0, 0, 0.6);
            backdrop-filter: blur(5px);
            border: 1px solid rgba(255, 255, 255, 0.2);
            border-radius: 8px;
            padding: 0.5rem 0.8rem;
            font-size: 1rem;
            color: #666;
            font-family: 'Courier New', monospace;
            font-weight: bold;
            min-width: 80px;
            text-align: center;
            transition: opacity 0.2s ease, transform 0.2s ease;
        }

        .fps-display.hidden {
            opacity: 0;
            transition: opacity 0.2s ease;
        }

        .button-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 1rem;
            margin-top: 1rem;
        }

        .button-grid .btn {
            margin-bottom: 0;
        }

        @media (max-width: 480px) {
            .button-grid {
                grid-template-columns: 1fr;
            }

            h1 {
                font-size: clamp(4rem, 25vw, 8rem);
            }

            .fps-display {
                top: 0.5rem;
                right: 0.5rem;
                font-size: 0.7rem;
                padding: 0.4rem 0.6rem;
            }
        }
    </style>
</head>
<body>
    <div class="fps-display hidden" id="fps">-- FPS</div>

    <div class="container">
        <h1 class="logo" id="logo">A</h1>
        <div class="button-grid">
            <button class="btn next"  data-cmd="/N">Next</button>
            <button class="btn hold"  data-cmd="/H">Hold</button>
            <button class="btn off"   data-cmd="/D">Off</button>
            <button class="btn white" data-cmd="/W">White</button>
        </div>
    </div>

    <script>
        // FPS monitoring: periodically GET the current FPS
        function updateFPS() {
            fetch('/fps')
                .then(r => r.text())
                .then(fps => {
                    const fpsValue = parseFloat(fps);
                    document.getElementById('fps').textContent =
                        isNaN(fpsValue) ? '-- FPS' : Math.round(fpsValue) + ' FPS';
                })
                .catch(() => {
                    document.getElementById('fps').textContent = '-- FPS';
                });
        }
        updateFPS();
        setInterval(updateFPS, 500);

        // Functions to generate a new random background gradient for the logo
        function randomHSL() {
            const hue = Math.floor(Math.random() * 360);     // any hue
            const sat = 100;
            const light = 50;
            return `hsl(${hue}, ${sat}%, ${light}%)`;
        }

        function randomGradient() {
            // pick between 3 and 6 colors
            const steps = 3 + Math.floor(Math.random() * 4);
            const colors = Array.from({ length: steps }, randomHSL);

            // repeat first color at end for smooth looping
            colors.push(colors[0]);

            // distribute stops evenly between 0% and 50%
            const stopPercent = 50 / (colors.length - 1);
            const stops = colors
                .map((c, i) => `${c} ${(i * stopPercent).toFixed(1)}%`)
                .join(', ');

            // create repeating-linear-gradient for seamless animation
            return `repeating-linear-gradient(to bottom right, ${stops})`;
        }

        // Add visual feedback for button presses
        document.addEventListener('DOMContentLoaded', function() {

            const h1 = document.getElementById("logo");
            h1.style.setProperty('--grad', randomGradient());

            const fpsEl = document.getElementById('fps');
            fpsEl.addEventListener('click', () => {
                fpsEl.classList.toggle('hidden');   // show/hide
            });

            document.querySelectorAll('.btn').forEach(btn => {
                // ripple effect
                btn.addEventListener('click', function(e) {
                    e.preventDefault(); // stop navigation
                    const ripple = document.createElement('span');
                    const rect = this.getBoundingClientRect();
                    const size = Math.max(rect.width, rect.height);
                    const x = e.clientX - rect.left - size / 2;
                    const y = e.clientY - rect.top - size / 2;

                    ripple.style.cssText = `
                        position: absolute;
                        width: ${size}px;
                        height: ${size}px;
                        left: ${x}px;
                        top: ${y}px;
                        background: rgba(255, 255, 255, 0.3);
                        border-radius: 50%;
                        transform: scale(0);
                        animation: ripple 0.6s linear;
                        pointer-events: none;
                    `;
                    this.appendChild(ripple);
                    setTimeout(() => ripple.remove(), 600);

                    // send POST in the background, avoid reloading the page
                    fetch(this.dataset.cmd, { method: 'POST' });
                });
            });
        });
    </script>
</body>
</html>
