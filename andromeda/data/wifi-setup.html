<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Andromeda WiFi Setup</title>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel+Decorative:wght@700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="common.css">
    <style>
        body {
            padding: 20px;
        }

        .section-divider {
            text-align: center;
            margin-top: 2rem;
            border-top: 1px solid rgba(255, 255, 255, 0.1);
            padding-top: 1.5rem;
        }

        .section-divider p {
            font-size: 0.9rem;
            color: #aaa;
            margin-bottom: 1rem;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1 class="logo" id="logo">A</h1>

        <button type="button" class="btn scan-btn" onclick="scanNetworks()" id="scanBtn">
            Scan for Networks
        </button>
        <div id="status"></div>
        <div id="networks"></div>

        <form method="post" action="/save" id="wifiForm">

            <div class="form-group">
                <label for="ssid">WiFi Network Name (SSID):</label>
                <input type="text" id="ssid" name="ssid" required placeholder="Enter network name or select from scan">
            </div>

            <div class="form-group">
                <label for="password">WiFi Password:</label>
                <input type="password" id="password" name="password" placeholder="Leave blank for open networks">
                <div class="show-password">
                    <input type="checkbox" id="showPassword" onchange="togglePassword()">
                    <label for="showPassword">Show password</label>
                </div>
            </div>

            <button type="submit" class="btn primary" id="connectBtn">Connect to WiFi</button>
        </form>

        <div class="section-divider">
            <p>Need to reconfigure? Clear saved credentials:</p>
            <button type="button" class="btn reset-btn" onclick="resetCredentials()">
                Clear WiFi Settings
            </button>
        </div>
    </div>

    <script>
        let selectedNetwork = null;

        // Generate random gradient for logo
        function randomHSL() {
            const hue = Math.floor(Math.random() * 360);
            const sat = 100;
            const light = 50;
            return `hsl(${hue}, ${sat}%, ${light}%)`;
        }

        function randomGradient() {
            const steps = 3 + Math.floor(Math.random() * 4);
            const colors = Array.from({ length: steps }, randomHSL);
            colors.push(colors[0]);

            const stopPercent = 50 / (colors.length - 1);
            const stops = colors
                .map((c, i) => `${c} ${(i * stopPercent).toFixed(1)}%`)
                .join(', ');

            return `repeating-linear-gradient(to bottom right, ${stops})`;
        }

        function scanNetworks() {
            const status = document.getElementById('status');
            const networks = document.getElementById('networks');
            const scanBtn = document.getElementById('scanBtn');

            scanBtn.disabled = true;
            scanBtn.innerHTML = '<span class="spinner"></span>Scanning...';

            status.innerHTML = '<div class="status loading"><span class="spinner"></span>Scanning for WiFi networks...</div>';
            networks.innerHTML = '';
            selectedNetwork = null;

            fetch('/scan')
                .then(response => {
                    if (!response.ok) {
                        throw new Error('Scan request failed');
                    }
                    return response.json();
                })
                .then(data => {
                    status.innerHTML = '';
                    scanBtn.disabled = false;
                    scanBtn.innerHTML = 'Scan for Networks';

                    if (data.networks && data.networks.length > 0) {
                        networks.innerHTML = '<strong>Available Networks (click to select):</strong>';

                        // Sort networks by signal strength (strongest first)
                        data.networks.sort((a, b) => b.rssi - a.rssi);

                        data.networks.forEach(network => {
                            if (network.ssid && network.ssid.trim() !== '') {
                                const div = document.createElement('div');
                                div.className = 'network-option';
                                div.onclick = () => selectNetwork(network, div);

                                const signalBars = getSignalBars(network.rssi);
                                const lockIcon = network.encryption !== 'none' ? '🔒' : '🔓';

                                div.innerHTML = `
                                    <div>
                                        <div class="network-name">${escapeHtml(network.ssid)}</div>
                                        <div class="network-info">${network.encryption}</div>
                                    </div>
                                    <div class="signal-strength">
                                        ${signalBars} ${network.rssi}dBm ${lockIcon}
                                    </div>
                                `;
                                networks.appendChild(div);
                            }
                        });
                    } else {
                        networks.innerHTML = '<div class="status error">No networks found. Make sure WiFi networks are available and try scanning again.</div>';
                    }
                })
                .catch(error => {
                    console.error('Scan error:', error);
                    status.innerHTML = '<div class="status error">Scan failed: ' + error.message + '</div>';
                    scanBtn.disabled = false;
                    scanBtn.innerHTML = 'Scan for Networks';
                });
        }

        function selectNetwork(network, element) {
            // Remove selection from all networks
            document.querySelectorAll('.network-option').forEach(el => {
                el.classList.remove('selected');
            });

            // Select clicked network
            element.classList.add('selected');
            selectedNetwork = network;

            // Fill in the form
            document.getElementById('ssid').value = network.ssid;

            // Clear password field for new selection
            document.getElementById('password').value = '';

            // Focus password field if network is encrypted
            if (network.encryption !== 'none') {
                document.getElementById('password').focus();
            }
        }

        function getSignalBars(rssi) {
            if (rssi >= -50) return '▰▰▰▰';      // Excellent
            if (rssi >= -60) return '▰▰▰▱';      // Good
            if (rssi >= -70) return '▰▰▱▱';      // Fair
            if (rssi >= -80) return '▰▱▱▱';      // Poor
            return '▱▱▱▱';                       // Very poor
        }

        function escapeHtml(text) {
            const div = document.createElement('div');
            div.textContent = text;
            return div.innerHTML;
        }

        function togglePassword() {
            const passwordField = document.getElementById('password');
            const checkbox = document.getElementById('showPassword');

            passwordField.type = checkbox.checked ? 'text' : 'password';
        }

        function validateForm() {
            const ssid = document.getElementById('ssid').value.trim();
            const connectBtn = document.getElementById('connectBtn');
            const form = document.getElementById('wifiForm');

            if (!ssid) {
                showStatus('Please enter a WiFi network name', 'error');
                return false;
            }

            // Disable form and show connecting status
            connectBtn.disabled = true;
            connectBtn.innerHTML = '<span class="spinner"></span>Connecting...';

            // Disable all form inputs
            form.querySelectorAll('input, button').forEach(el => {
                if (el !== connectBtn) el.disabled = true;
            });

            showStatus('Testing connection to "' + ssid + '"...', 'loading');
            return true;
        }

        function resetCredentials() {
            if (confirm('This will clear all saved WiFi settings and restart the device. Continue?')) {
                showStatus('Clearing WiFi settings...', 'loading');

                fetch('/reset', { method: 'POST' })
                    .then(response => {
                        if (response.ok) {
                            showStatus('Settings cleared! Device is restarting...', 'success');
                        } else {
                            throw new Error('Reset failed');
                        }
                    })
                    .catch(error => {
                        showStatus('Reset failed: ' + error.message, 'error');
                    });
            }
        }

        function showStatus(message, type) {
            const status = document.getElementById('status');
            const spinner = type === 'loading' ? '<span class="spinner"></span>' : '';
            status.innerHTML = `<div class="status ${type}">${spinner}${message}</div>`;
        }

        // Initialize page
        document.addEventListener('DOMContentLoaded', function() {
            // Set random gradient for logo
            const h1 = document.getElementById("logo");
            h1.style.setProperty('--grad', randomGradient());

            // Auto-scan after a small delay
            setTimeout(scanNetworks, 500);
        });

        // Handle form submission errors (if user navigates back)
        window.addEventListener('pageshow', function(event) {
            if (event.persisted) {
                // Reset form state if page was cached
                document.getElementById('connectBtn').disabled = false;
                document.getElementById('connectBtn').innerHTML = 'Connect to WiFi';
                document.querySelectorAll('input, button').forEach(el => {
                    el.disabled = false;
                });
            }
        });
    </script>
</body>
</html>
