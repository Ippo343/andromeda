[platformio]
; Choose which one to build by default, or build all
default_envs = esp32_wroom, esp32_s3_zero, esp32_c3_zero

; ----------------------------------------------------------------
; COMMON CONFIGURATION (Shared by all boards)
; ----------------------------------------------------------------
[env]
platform = espressif32
framework = arduino

upload_speed = 921600
monitor_speed = 115200
monitor_filters =
    esp32_exception_decoder
    time

board_build.filesystem = littlefs
board_build.cppstd = c++17
build_unflags = -std=gnu++11
; No throw/try anywhere in the project; disabling exceptions/unwind tables
; is a standard embedded-firmware flash-size win (app partition is already
; at ~72-77% used) with no code changes needed.
build_flags =
    -fno-exceptions
    -fno-unwind-tables
    -fno-asynchronous-unwind-tables
extra_scripts =
    pre:build-scripts/inject_version.py
    ; Fails a hardware build that blows past custom_flash_ceiling_pct (set
    ; per env below). A tripwire for sudden bloat; no-op for native envs.
    post:build-scripts/check_flash_ceiling.py

; Files the hardware envs must NOT compile (they have no build_src_filter of
; their own; env:native and env:native_runtime set theirs explicitly and are
; unaffected):
;  - native-runtime.cpp: host-simulator glue. Its <iostream>/<thread>/<mutex>
;    + DynamicJsonDocument static init drags the whole libstdc++ iostreams +
;    locale + wide-char + float-printf runtime into the link (~230 KB;
;    measured 89.5% -> 71.7% app use on esp32_wroom).
;  - geometry/grid_test_device.cpp: a simulator-only fake 40x40 grid model
;    whose compile-time coordinate table is ~6.4 KB of rodata. model_registry
;    .cpp drops its registry entry under !NATIVE_BUILD to match.
build_src_filter = +<*> -<native-runtime.cpp> -<geometry/grid_test_device.cpp>

lib_deps =
    fastled/FastLED@^3.10.1
    thijse/ArduinoLog@^1.1.1
    https://github.com/lacamera/ESPAsyncWebServer.git#3.1.0
    ; Pinned to v6 (StaticJsonDocument, fixed-capacity, no heap growth) -
    ; v7 replaced it with a single JsonDocument that grows via a heap
    ; allocator by default, which conflicts with this project's
    ; no-allocation-in-hot-paths convention.
    bblanchon/ArduinoJson@^6.21.5

; ----------------------------------------------------------------
; VARIANTS
; ----------------------------------------------------------------

; 1. ESP32-WROOM (The Classic)
[env:esp32_wroom]
board = esp32dev
; 4 MB board: custom table trims the filesystem to 1 MB and gives the freed
; space to the two OTA app slots (1.25 -> 1.4375 MB each). See the CSV.
board_build.partitions = partitions/andromeda_4mb.csv
custom_flash_ceiling_pct = 75  ; currently ~62%
build_flags =
	${env.build_flags}
    -DESP32_WROOM

; 2. ESP32-S3-Zero (Waveshare/Similar)
[env:esp32_s3_zero]
board = esp32-s3-devkitc-1
custom_flash_ceiling_pct = 40  ; 8 MB board, currently ~26%
build_flags =
	${env.build_flags}
    -DESP32_S3
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1 ; Ensures Serial works over the USB-C port

; 3. ESP32-C3-Zero (Waveshare/Similar)
[env:esp32_c3_zero]
board = esp32-c3-devkitm-1
; 4 MB board, same custom table as esp32_wroom (esp32_s3_zero is 8 MB and
; keeps its roomy default_8MB.csv).
board_build.partitions = partitions/andromeda_4mb.csv
custom_flash_ceiling_pct = 75  ; currently ~61%
build_flags =
	${env.build_flags}
    -DESP32_C3
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1 ; Ensures Serial works over the USB-C port

; ----------------------------------------------------------------
; NATIVE (host) UNIT TESTS
; Runs on the dev machine via the host GCC toolchain, not on real hardware.
; FastLED auto-selects its "stub" platform when __x86_64__ is defined
; (true for a native x86_64 g++ build), so no FASTLED_STUB_IMPL define needed.
; ----------------------------------------------------------------
[env:native]
platform = native
framework =
test_build_src = yes
build_flags =
    -std=c++17
    -DUNIT_TEST
    -DNATIVE_BUILD
    -DFASTLED_STUB_IMPL ; enables FastLED's own millis()/delay()/micros() implementations for native builds
    -DUSE_ARDUINO=0   ; FastLED's digital_pin.cpp auto-detects our mock Arduino.h via __has_include
                      ; and would otherwise require pinMode/digitalRead/etc we don't stub - not needed for tests
    -DF_CPU=240000000L ; ESP32's actual value; native has no default that fits uint8_t preferred_cpu_freq_mhz
    -DARDUINOJSON_ENABLE_ARDUINO_STRING=0 ; ArduinoJson auto-detects our mock WString.h and tries to
    -DARDUINOJSON_ENABLE_ARDUINO_STREAM=0 ; wire up String/Stream/Print/__FlashStringHelper support against
    -DARDUINOJSON_ENABLE_ARDUINO_PRINT=0  ; it - the mocks don't implement that surface, so explicitly disable
    -DARDUINOJSON_ENABLE_PROGMEM=0        ; all Arduino-specific ArduinoJson integrations for native builds;
                                           ; ws-state-builder.h only uses the char*/size_t buffer API anyway
    --coverage
    -lgcov
    -Itest/mocks
; Only src files verified to compile host-side (no WiFi/ArduinoLog/NVS/etc)
; are included here. Expand this list phase by phase as seams land - see
; the testing plan for the full rollout (comms.cpp and animations.cpp are
; permanently excluded, see plan Part 1).
build_src_filter =
    -<*>
    +<utils.cpp>
    +<geometry/geometry.cpp>
    +<geometry/model_registry.cpp>
    +<geometry/andromeda_mk1.cpp>
    +<geometry/single_strip_test_device.cpp>
    +<geometry/grid_test_device.cpp>
    +<geometry/L70_mk1.cpp>
    +<geometry/L10_mk1.cpp>
    +<effects-utils.cpp>
    +<energy-param.cpp>
    +<effects/effects-registry.cpp>
    ; DeviceIdentity only touches Preferences (NVS) and WiFi.macAddress(),
    ; both mocked natively (test/mocks/Preferences.h, test/mocks/WiFi.h) -
    ; same seam as FactoryConfig/BrightnessConfig in geometry.cpp/
    ; mission-control.cpp.
    +<device-identity.cpp>
    ; animations.cpp and comms.cpp declare most of their classes locally in
    ; the .cpp (not exposed via a header), so their tests instead #include
    ; the .cpp directly to reach them (see test_animations.cpp,
    ; test_comms_integration.cpp) - adding them here too would cause
    ; duplicate-symbol link errors. comms.cpp additionally can't go through
    ; this shared filter at all, since every native test target links
    ; against it: it transitively needs MissionControl/PerformanceMonitor,
    ; which most test targets never define.
    ; wifi-esp-adapters.cpp (the real WiFi/Preferences-backed
    ; IWiFiConnector/IPreferencesStore implementations comms.cpp delegates
    ; to) stays excluded from native entirely: it polls WiFi.status() in real
    ; time, and native tests exercise WifiManager purely through fakes
    ; instead - see include/wifi-esp-adapters.h.
lib_deps =
    fastled/FastLED@^3.10.1
    ; Host-buildable; ws-state-builder.h never touches Arduino String so no
    ; extra native mocking is needed beyond this dependency itself.
    bblanchon/ArduinoJson@^6.21.5

; ----------------------------------------------------------------
; NATIVE RUNTIME (host) - the real render loop, no tests
; Boots main.cpp's real setup()/loop() natively (skipping Serial/WiFi/comms.cpp
; via NATIVE_RUNTIME guards) so the whole MissionControl/effects/animations
; pipeline can run on the dev machine with no ESP32 attached, driven over
; stdio by tools/native-bridge instead of a real WebSocket. See the plan at
; would-it-be-feasible-nifty-teapot.md for the full design.
; ----------------------------------------------------------------
[env:native_runtime]
platform = native
framework =
extra_scripts =
    ${env.extra_scripts}
    pre:build-scripts/static_link_native_runtime.py
build_flags =
    -std=c++17
    -DUNIT_TEST     ; reuses mission-control.cpp's esp_restart()-mock guard and
                     ; the friend-class test accessors; harmless here, nothing
                     ; in this env actually uses the accessors.
    -DNATIVE_RUNTIME
    -DNATIVE_BUILD
    -DFASTLED_STUB_IMPL
    -DUSE_ARDUINO=0
    -DF_CPU=240000000L
    -DARDUINOJSON_ENABLE_ARDUINO_STRING=0
    -DARDUINOJSON_ENABLE_ARDUINO_STREAM=0
    -DARDUINOJSON_ENABLE_ARDUINO_PRINT=0
    -DARDUINOJSON_ENABLE_PROGMEM=0
    -Itest/mocks
build_src_filter =
    -<*>
    +<utils.cpp>
    +<geometry/geometry.cpp>
    +<geometry/model_registry.cpp>
    +<geometry/andromeda_mk1.cpp>
    +<geometry/single_strip_test_device.cpp>
    +<geometry/grid_test_device.cpp>
    +<geometry/L70_mk1.cpp>
    +<geometry/L10_mk1.cpp>
    +<effects-utils.cpp>
    +<energy-param.cpp>
    +<effects/effects-registry.cpp>
    +<device-identity.cpp>
    +<animations.cpp>
    +<mission-control.cpp>
    +<native-runtime.cpp>
    +<main.cpp>
    ; comms.cpp and wifi-esp-adapters.cpp excluded on purpose: comms.cpp is
    ; written against real ESPAsyncWebServer/AsyncWebSocket sockets that only
    ; have an in-process (no real socket) mock natively - see the plan doc.
    ; The socket-facing job is done by tools/native-bridge/server.js instead;
    ; the protocol logic (ws-command-parser.h/ws-state-builder.h) is reused
    ; directly by native-runtime.cpp.
lib_deps =
    fastled/FastLED@^3.10.1
    bblanchon/ArduinoJson@^6.21.5
